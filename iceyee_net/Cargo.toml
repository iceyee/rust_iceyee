[package]
name = "iceyee_net"
version = "13.0.0"
edition = "2024"

description = "Net Protocol."
keywords = ["http", "httpclient", "httpserver"]
license = "Apache-2.0"
repository = "https://github.com/iceyee/rust_iceyee/tree/main/iceyee_net/"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-compression = { version = "0.4", features = ["all"] }
iceyee_encoder = "13"
iceyee_error = "13"
iceyee_logger = "13"
iceyee_random = "13"
iceyee_time = "13"
lettre = { version = "0.11", features = ["tokio1-native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-native-tls = "0.3"
